name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_registry: https://registry.npmjs.org
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-builder/electron-builder-binaries/releases/download/

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check i18n keys
        run: npm run check:i18n

      - name: Build
        run: npm run build
